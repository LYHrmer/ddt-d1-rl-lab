name: D1 lidar compound route
on:
  push:
    paths: &lidar_paths
      - 'tools111/**'
      - 'tools100/sensor100.py'
      - 'tools110/**'
      - 'training/d1_rl/interface.py'
      - 'tests/test_lidar_compound111.py'
      - 'tests/test_lidar_receipts111.py'
      - 'reports/lidar_compound111/**'
      - 'reports/pointcloud100*'
      - 'reports/speed110/**'
      - 'docs/lidar_compound111_proposal.md'
      - 'docs/assets/lidar111.mp4'
      - '.github/workflows/lidar-compound111.yml'
  pull_request:
    paths: *lidar_paths
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --quiet numpy==2.2.6
      - run: python -B -m unittest discover -s tests -p 'test_lidar*111.py'
      - run: python -B -m tools111.archive
      - run: python -B -m tools111.receipts
      - run: python -B -m tools111.results
