name: clean-history62
on:
  push:
    branches: [main]
    paths: ['tools62/**', 'tests/test_clean62.py', 'docs/experiments62/**', '.github/workflows/clean-history62.yml']
  pull_request:
    paths: ['tools62/**', 'tests/test_clean62.py', 'docs/experiments62/**', '.github/workflows/clean-history62.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-22.04
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: '.:training'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --quiet 'numpy<3' pytest
      - run: python -m pytest --noconftest tests/test_clean62.py -q
