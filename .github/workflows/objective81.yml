name: objective81
on:
  push:
    branches: [main]
    paths: ['tools81/**', 'tests/test_*81.py', '.github/workflows/objective81.yml']
  pull_request:
    paths: ['tools81/**', 'tests/test_*81.py', '.github/workflows/objective81.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-objective-components:
    runs-on: ubuntu-22.04
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
      - run: python -m pip install --quiet 'numpy<3' pytest
      - run: python -B -m pytest --noconftest tests/test_policy81.py tests/test_compare81.py tests/test_run81.py tests/test_diagnostics81.py -q
