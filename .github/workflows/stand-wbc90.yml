name: D1 stand and offline WBC

on:
  push:
    paths:
      - 'tools90/**'
      - 'tests/*90.py'
      - 'docs/experiments90/**'
      - 'docs/assets/stand90.png'
      - 'reports/stand_wbc90*'
      - '.github/workflows/stand-wbc90.yml'
  pull_request:
    paths:
      - 'tools90/**'
      - 'tests/*90.py'
      - 'docs/experiments90/**'
      - 'docs/assets/stand90.png'
      - 'reports/stand_wbc90*'
      - '.github/workflows/stand-wbc90.yml'

permissions:
  contents: read

jobs:
  verify-targets-and-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      MUJOCO_GL: disable
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'numpy==2.2.6' 'scipy==1.15.3' 'osqp==1.1.3' 'mujoco==3.3.0' 'gymnasium==1.2.0' 'pytest==8.4.2'
      - name: Verify bounded wheel targets, sensor timing, inverse dynamics, and the published sample
        run: python -m pytest -p no:cacheprovider -q tests/test*90.py
      - name: Check moving wheel rim acceleration on a synthetic articulated MuJoCo model
        run: python -m pytest -p no:cacheprovider -q tools90/check_rolling_bias90.py
