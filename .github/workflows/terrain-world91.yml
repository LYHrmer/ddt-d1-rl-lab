name: D1 terrain world model

on:
  push:
    paths: ['tools91/**', 'tests/*91.py', 'docs/experiments91/**', 'docs/terrain_world91.md', 'docs/assets/terrain_world91.png', 'reports/terrain_world91*', '.github/workflows/terrain-world91.yml']
  pull_request:
    paths: ['tools91/**', 'tests/*91.py', 'docs/experiments91/**', 'docs/terrain_world91.md', 'docs/assets/terrain_world91.png', 'reports/terrain_world91*', '.github/workflows/terrain-world91.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      PYTHONPATH: training
      MUJOCO_GL: disable
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -m pip install --quiet 'numpy==2.2.6' 'gymnasium==1.2.0' 'mujoco==3.3.0' 'pytest==8.4.2'
      - name: Verify offline windows, model gradients, imagined feedback and published physical scores
        run: python -m pytest -p no:cacheprovider -q tests/test*91.py
