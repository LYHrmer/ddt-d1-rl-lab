name: terrain-preview84

on:
  push:
    paths:
      - 'tools84/**'
      - 'tests/test_terrain_gradient84.py'
      - 'docs/assets/project84/**'
      - '.github/workflows/terrain-preview84.yml'
  pull_request:
    paths:
      - 'tools84/**'
      - 'tests/test_terrain_gradient84.py'
      - 'docs/assets/project84/**'
      - '.github/workflows/terrain-preview84.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'pytest>=7,<9'
      - run: python -m pytest --noconftest tests/test_terrain_gradient84.py -q
