name: static-checks

# Asset-free subset of the bounded-experiment static checks. It verifies that
# each published contract config is exactly the declared single-term derivation
# of the frozen pilot03d base, and that the added reward terms have the shape,
# gradient range and bounded worst case their contracts claim. It loads no
# MuJoCo model and runs zero physics steps, so it works from a clean clone
# without the D1 robot model, which this repository does not redistribute.
#
# The full checks in tools04/check_task04{a,b}_static.py do construct the
# environment and therefore need the robot model; they run on the workstation.

on:
  push:
    branches: [main]
    paths:
      - 'training/**'
      - 'tests/**'
      - 'tools04/**'
      - 'tools05/**'
      - 'tools08/**'
      - 'tools09/**'
      - 'tools10/**'
      - 'tools11/**'
      - 'tools12/**'
      - 'tools13/**'
      - 'tools14/**'
      - 'tools15/**'
      - 'tools16/**'
      - 'tools17/**'
      - 'tools18/**'
      - 'tools19/**'
      - 'tools21/**'
      - 'tools22/**'
      - 'tools23/**'
      - 'runtime19/**'
      - '.github/workflows/static-checks.yml'
  pull_request:
    paths:
      - 'training/**'
      - 'tests/**'
      - 'tools04/**'
      - 'tools05/**'
      - 'tools08/**'
      - 'tools09/**'
      - 'tools10/**'
      - 'tools11/**'
      - 'tools12/**'
      - 'tools13/**'
      - 'tools14/**'
      - 'tools15/**'
      - 'tools16/**'
      - 'tools17/**'
      - 'tools18/**'
      - 'tools19/**'
      - 'tools21/**'
      - 'tools22/**'
      - 'tools23/**'
      - 'runtime19/**'
      - '.github/workflows/static-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-static-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install the import-chain dependencies
        # Pinned to the versions the receipts record. No robot model, no
        # weights and no colleague assets are needed or fetched.
        run: python -m pip install --quiet 'mujoco==3.3.0' 'gymnasium==1.2.0' 'numpy<3' pytest

      - name: Interface and reward-term unit tests, no physics
        run: PYTHONPATH="$PWD/training" python -m pytest tests -q

      - name: Contract 04 static checks, no physics
        run: PYTHONPATH="$PWD/training" python -B tools04/check_contract_static_ci.py --output ci_static_report

      - name: Confirm the receipt reports zero integration
        run: |
          python - <<'PY'
          import json, pathlib, sys
          r = json.loads(pathlib.Path('ci_static_report/report.json').read_text())
          assert r['status'] == 'PASS', r['failed_checks']
          assert r['native_integration_steps_executed'] == 0
          assert r['robot_model_required'] is False
          print(f"{r['checks_total']} checks passed, 0 physics steps")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract04-ci-static-report
          path: ci_static_report/report.json

  cpu-velocity-candidate:
    runs-on: ubuntu-22.04
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install CPU numerical dependencies
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -m pip install --quiet 'stable-baselines3==2.7.0' 'gymnasium==1.2.0' 'mujoco==3.3.0' 'onnx==1.18.0' 'onnxruntime==1.23.2' 'numpy<3' pytest

      - name: Verify labels, PPO auxiliary update and complete export graph
        # Export configures inter-op threads before any numerical work in its
        # process; do not depend on resetting Torch global state after PPO tests.
        run: |
          python -m pytest tests/test_velocity_labels15.py tests/test_velocity_policy15.py -q
          python -m pytest tests/test_export_velocity15.py -q

      - name: Verify bounded comparison preparation with synthetic resources
        run: python -m pytest tests/test_contract16.py tests/test_train_comparison16.py tests/test_run_comparison16.py tests/test_comparison16.py -q

      - name: Verify completed-checkpoint export and bounded closeout without robot physics
        run: python -m pytest tests/test_export_completed17.py tests/test_verify_cpp17.py tests/test_provenance17.py tests/test_formal17.py tests/test_run_closeout17.py -q

      - name: Verify independent delay optimization without robot physics
        run: python -m pytest --noconftest tests/test_delay_env18.py tests/test_train_delay18.py tests/test_common18.py tests/test_evaluate_delay18.py tests/test_export_delay18.py -q

      - name: Verify C++ actor protocol and bounded closed loop with synthetic inputs
        run: python -m pytest --noconftest tests/test_cpp_actor19.py tests/test_cpp_closedloop19.py -q

      - name: Verify independent completed-zero closeout without model or physics
        run: python -m pytest --noconftest tests/test_closeout_completed18.py -q

      - name: Verify low-LR bounded candidate and dirty RPC recovery without physics
        run: python -m pytest --noconftest tests/test_common22.py tests/test_checked_runtime22.py tests/test_train_low_lr22.py tests/test_run_low_lr22.py -q

      - name: Verify independent baseline C++ diagnostic with synthetic processes
        run: python -m pytest --noconftest tests/test_cpp_diagnostic23.py -q

      - name: Export a random numerical fixture, no robot or training
        run: python tools15/export_velocity15.py --self-check --output ci_velocity15_fixture

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velocity15-numerical-fixture
          path: ci_velocity15_fixture/
