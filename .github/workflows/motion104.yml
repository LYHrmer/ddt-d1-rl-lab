name: D1 cloud motion readback

on:
  push:
    paths: ['tools104/**', 'tests/test_motion104.py', 'reports/motion104/**', 'docs/jeplo_motion_compensation104.md', '.github/workflows/motion104.yml']
  pull_request:
    paths: ['tools104/**', 'tests/test_motion104.py', 'reports/motion104/**', 'docs/jeplo_motion_compensation104.md', '.github/workflows/motion104.yml']

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --quiet numpy==2.2.6 pytest==8.4.2
      - run: python -B -m pytest --noconftest -p no:cacheprovider -q tests/test_motion104.py
      - run: python -B -m tools104.motion104
