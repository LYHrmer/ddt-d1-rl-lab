name: D1 compound terrain lidar and encoder verification
on:
  push:
    paths: &study_paths
      - 'tools116/**'
      - 'tests/test_*116.py'
      - 'docs/experiments116/**'
      - 'docs/lidar_encoder116*.md'
      - 'docs/assets/compound116.mp4'
      - 'reports/compound116/**'
      - 'reports/lidar_compound111/**'
      - 'reports/speed110/results.json'
      - 'docs/lidar_compound111_proposal.md'
      - 'docs/experiments100/pointcloud_density.json'
      - 'tools115/archive.py'
      - 'tools114/**'
      - 'tools113/**'
      - 'tools112/**'
      - 'tools111/**'
      - 'tools110/**'
      - 'tools109/run109.py'
      - 'tools108/video108.py'
      - 'tools102/mesa_video102.py'
      - 'tools100/sensor100.py'
      - 'tools92/launch92.py'
      - 'tools91/launch91.py'
      - 'tools87/terrain87.py'
      - 'tools27/resource_guard27.py'
      - 'training/configs/pilot03d.json'
      - 'training/d1_rl/**'
      - '.github/workflows/compound116.yml'
  pull_request:
    paths: *study_paths
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --quiet numpy==2.2.6
      - run: python -B -m unittest discover -s tests -p 'test_*116.py'
      - name: Reconstruct lidar and servo signals and score all paired routes
        run: python -B -m tools116.archive
