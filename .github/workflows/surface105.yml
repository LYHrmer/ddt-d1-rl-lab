name: D1 terrain support readout

on:
  push:
    paths: ['tools105/**', 'tests/test_*105.py', 'docs/experiments105/**', 'reports/surface105/**', 'reports/jeplo101/**', 'reports/motion104/**', 'tools104/motion104.py', 'tools101/score101.py', 'tools100/score100.py', '.github/workflows/surface105.yml']
  pull_request:
    paths: ['tools105/**', 'tests/test_*105.py', 'docs/experiments105/**', 'reports/surface105/**', 'reports/jeplo101/**', 'reports/motion104/**', 'tools104/motion104.py', 'tools101/score101.py', 'tools100/score100.py', '.github/workflows/surface105.yml']

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU replay dependencies
        run: python -m pip install --quiet numpy==2.2.6 pytest==8.4.2
      - name: Check measured inputs, synthetic support geometry and paired grading
        run: python -B -m pytest -p no:cacheprovider -q tests/test_*105.py
      - name: Replay both published readouts and recompute every registered vote
        shell: bash
        run: |
          archive=reports/surface105
          if [[ -d "$archive" ]] || git cat-file -e "HEAD^:$archive/report.json" 2>/dev/null; then
            python -B -m tools105.run105 check
          fi
