name: observed-gradient55
on:
  push:
    branches: [main]
    paths: ['tools55/**', 'tests/test_*55.py', 'docs/experiments55/**', '.github/workflows/observed-gradient55.yml']
  pull_request:
    paths: ['tools55/**', 'tests/test_*55.py', 'docs/experiments55/**', '.github/workflows/observed-gradient55.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observed-cpu:
    runs-on: ubuntu-22.04
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: '.:training'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -m pip install --quiet 'numpy<3' pytest
      - name: Verify observed gradients and prediction seals
        run: python -m pytest --noconftest tests/test_observed55.py tests/test_run55.py tests/test_numerics54.py -q
