name: model-gradient53
on:
  push:
    branches: [main]
    paths: ['tools53/**', 'tests/test_*53.py', 'docs/experiments53/**', '.github/workflows/model-gradient53.yml']
  pull_request:
    paths: ['tools53/**', 'tests/test_*53.py', 'docs/experiments53/**', '.github/workflows/model-gradient53.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-cpu:
    runs-on: ubuntu-22.04
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: '.:training'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -m pip install --quiet 'numpy<3' pytest
      - name: Test new collection and selection with frozen gradient components
        run: python -m pytest --noconftest tests/test_adapter52.py tests/test_dynamics52.py tests/test_control52.py tests/test_collection53.py tests/test_run_pilot53.py -q
