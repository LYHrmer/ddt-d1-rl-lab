name: D1 suffix replay diagnostics

on:
  push:
    paths: ['tools97/**', 'tests/test_suffix*97*.py', 'docs/experiments97/**', 'docs/supermimic_suffix_replay97*', 'docs/assets/suffix_replay97.mp4', 'reports/suffix_replay97*', '.github/workflows/suffix-replay97.yml']
  pull_request:
    paths: ['tools97/**', 'tests/test_suffix*97*.py', 'docs/experiments97/**', 'docs/supermimic_suffix_replay97*', 'docs/assets/suffix_replay97.mp4', 'reports/suffix_replay97*', '.github/workflows/suffix-replay97.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --quiet 'numpy==2.2.6' 'pytest==8.4.2'
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -c 'import torch'
      - name: Test cut state, action delay, attribution and video provenance
        run: python -B -m pytest -p no:cacheprovider -q tests/test_suffix*97*.py
      - name: Recompute the published diagnostic from recorded curves
        run: python -B -m tools97.publish97 --check
