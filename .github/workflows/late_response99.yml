name: D1 late response loss

on:
  push:
    paths: ['tools99/**', 'tests/test_*99.py', 'docs/experiments99/**', 'docs/supermimic_late_response99*', 'docs/assets/late_response99.mp4', 'reports/late_response99*', '.github/workflows/late_response99.yml']
  pull_request:
    paths: ['tools99/**', 'tests/test_*99.py', 'docs/experiments99/**', 'docs/supermimic_late_response99*', 'docs/assets/late_response99.mp4', 'reports/late_response99*', '.github/workflows/late_response99.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --quiet 'numpy==2.2.6' 'pytest==8.4.2'
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -c 'import torch'
      - name: Check gradients, matched fits, sealed blind endpoints and movie
        run: |
          python -B -m pytest -p no:cacheprovider -q tests/test_*99.py
          python -B -m tools99.data99
      - name: Recompute both comparisons and all promotion gates from public files
        run: python -B -m tools99.publish99 --check
