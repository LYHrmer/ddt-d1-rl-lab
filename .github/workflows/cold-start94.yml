name: D1 cold-start model-based RL

on:
  push:
    paths: ['tools94/**', 'tests/test_cold94*.py', 'docs/experiments94/**', 'docs/supermimic_cold_start94*', 'docs/assets/cold_start94.mp4', 'reports/cold_start94*', '.github/workflows/cold-start94.yml']
  pull_request:
    paths: ['tools94/**', 'tests/test_cold94*.py', 'docs/experiments94/**', 'docs/supermimic_cold_start94*', 'docs/assets/cold_start94.mp4', 'reports/cold_start94*', '.github/workflows/cold-start94.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      PYTHONPATH: training
      MUJOCO_GL: disable
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -m pip install --quiet 'numpy==2.2.6' 'gymnasium==1.2.0' 'mujoco==3.3.0' 'pytest==8.4.2' Pillow
      - name: Verify cold learning, native interfaces and published measurements
        run: python -m pytest -p no:cacheprovider -q tests/test_cold94*.py
