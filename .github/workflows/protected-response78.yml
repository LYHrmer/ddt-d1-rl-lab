name: protected-response78
on:
  push:
    branches: [main]
    paths: ['tools78/**', 'tests/test_*78.py', '.github/workflows/protected-response78.yml']
  pull_request:
    paths: ['tools78/**', 'tests/test_*78.py', '.github/workflows/protected-response78.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  differentiable-preservation:
    runs-on: ubuntu-22.04
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
      - run: python -m pip install --quiet 'numpy<3' pytest
      - run: python -B -m pytest --noconftest tests/test_model78.py tests/test_compare78.py -q
