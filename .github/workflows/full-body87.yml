name: full-body-perception87

on:
  push:
    paths:
      - 'tools87/**'
      - 'tests/*87.py'
      - 'docs/experiments87/**'
      - '.github/workflows/full-body87.yml'
  pull_request:
    paths:
      - 'tools87/**'
      - 'tests/*87.py'
      - 'docs/experiments87/**'
      - '.github/workflows/full-body87.yml'

permissions:
  contents: read

jobs:
  policy-and-course:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
      - run: python -m pip install 'stable-baselines3==2.7.0' 'gymnasium==1.2.0' 'mujoco==3.3.0' 'numpy<3' Pillow pytest
      - name: Check actor and critic inputs, Adam state, terrain, scoring and recording
        run: >-
          python -m pytest --noconftest -q tests/test_fullbody_ppo87.py
          tests/test_whole_body_terrain87.py tests/test_fullbody_scores87.py tests/test_full_body_video87.py
