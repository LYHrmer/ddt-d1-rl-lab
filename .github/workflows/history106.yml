name: D1 terrain history
on:
  push:
    paths: ['tools106/**', 'tests/test_*106.py', 'docs/experiments106/**', 'reports/history106/**', 'reports/surface105/**', 'reports/pointcloud100*', 'tools105/**', 'tools104/motion104.py', '.github/workflows/history106.yml']
  pull_request:
    paths: ['tools106/**', 'tests/test_*106.py', 'docs/experiments106/**', 'reports/history106/**', 'reports/surface105/**', 'reports/pointcloud100*', 'tools105/**', 'tools104/motion104.py', '.github/workflows/history106.yml']
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --quiet numpy==2.2.6 pytest==8.4.2
      - run: python -B -m pytest -p no:cacheprovider -q tests/test_*106.py
      - name: Verify registered sources and replay sealed measurements
        run: |
          sha256sum --check --status docs/experiments106/sources.sha256
          if [[ -d reports/history106 ]] || git cat-file -e 'HEAD^:reports/history106/report.json' 2>/dev/null; then
            python -B -m tools106.run106 check
          fi
