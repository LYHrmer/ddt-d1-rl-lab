name: D1 point-cloud sensing

on:
  push:
    paths: ['tools100/**', 'tests/test_*100.py', 'docs/experiments100/**', 'docs/jeplo_d1_perception*', 'docs/assets/pointcloud100.mp4', 'reports/pointcloud100*', '.github/workflows/pointcloud100.yml']
  pull_request:
    paths: ['tools100/**', 'tests/test_*100.py', 'docs/experiments100/**', 'docs/jeplo_d1_perception*', 'docs/assets/pointcloud100.mp4', 'reports/pointcloud100*', '.github/workflows/pointcloud100.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install verification dependencies
        run: |
          python -m pip install --quiet 'numpy==2.2.6' 'pytest==8.4.2' 'pillow==11.3.0'
          if [ ! -r /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ]; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-noto-cjk
          fi
      - name: Check sensor geometry, paired gates and published movie
        run: python -B -m pytest -p no:cacheprovider -q tests/test_*100.py
      - name: Independently reconstruct every prediction from sealed public point clouds
        run: python -B -m tools100.readback100 --check
