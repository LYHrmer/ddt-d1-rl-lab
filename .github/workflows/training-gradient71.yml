name: training-gradient71
on:
  push:
    branches: [main]
    paths: ['tools71/**', 'tests/test_audit71.py', 'tests/test_run71.py', 'docs/experiments71/**', '.github/workflows/training-gradient71.yml']
  pull_request:
    paths: ['tools71/**', 'tests/test_audit71.py', 'tests/test_run71.py', 'docs/experiments71/**', '.github/workflows/training-gradient71.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  training-only-audit:
    runs-on: ubuntu-22.04
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: '.:training'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -m pip install --quiet 'numpy<3' pytest
      - name: Check complete training reduction, gradient geometry and immutable sources
        run: python -m pytest --noconftest tests/test_audit71.py tests/test_run71.py -q
