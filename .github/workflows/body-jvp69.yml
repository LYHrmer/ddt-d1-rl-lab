name: body-jvp69
on:
  push:
    branches: [main]
    paths: ['tools69/**', 'tests/test_fit69.py', 'tests/test_run69.py', 'tests/test_outputs69.py', 'docs/experiments69/**', '.github/workflows/body-jvp69.yml']
  pull_request:
    paths: ['tools69/**', 'tests/test_fit69.py', 'tests/test_run69.py', 'tests/test_outputs69.py', 'docs/experiments69/**', '.github/workflows/body-jvp69.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-body-contracts:
    runs-on: ubuntu-22.04
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: '.:training'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -m pip install --quiet 'numpy<3' pytest
      - name: Verify unchanged control, body derivatives and strict paired gates
        run: python -m pytest --noconftest tests/test_fit69.py tests/test_run69.py tests/test_outputs69.py -q
