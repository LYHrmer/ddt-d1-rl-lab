name: D1 fixed-action replay

on:
  push:
    paths: ['tools92/**', 'tests/*92.py', 'docs/experiments92/**', 'docs/fixed_actions92.md', 'docs/assets/fixed_actions92.png', 'reports/fixed_actions92*', '.github/workflows/fixed-actions92.yml']
  pull_request:
    paths: ['tools92/**', 'tests/*92.py', 'docs/experiments92/**', 'docs/fixed_actions92.md', 'docs/assets/fixed_actions92.png', 'reports/fixed_actions92*', '.github/workflows/fixed-actions92.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      PYTHONPATH: training
      MUJOCO_GL: disable
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -m pip install --quiet 'numpy==2.2.6' 'gymnasium==1.2.0' 'mujoco==3.3.0' 'pytest==8.4.2'
      - name: Check action timing and reproduce all published scores from the compact traces
        run: python -m pytest -p no:cacheprovider -q tests/test*92.py
