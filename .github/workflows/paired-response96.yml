name: D1 paired world-model response

on:
  push:
    paths: ['tools96/**', 'tests/test_paired_response96*.py', 'docs/experiments96/**', 'docs/supermimic_paired_response96*', 'docs/assets/paired_response96.mp4', 'reports/paired_response96*', '.github/workflows/paired-response96.yml']
  pull_request:
    paths: ['tools96/**', 'tests/test_paired_response96*.py', 'docs/experiments96/**', 'docs/supermimic_paired_response96*', 'docs/assets/paired_response96.mp4', 'reports/paired_response96*', '.github/workflows/paired-response96.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --quiet 'numpy==2.2.6' 'pytest==8.4.2'
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -c 'import torch'
      - name: Test matched fitting, acceptance gates and movie provenance
        run: python -B -m pytest -p no:cacheprovider -q tests/test_paired_response96*.py
      - name: Recompute sealed measurements and both models' scores
        if: ${{ hashFiles('reports/paired_response96.json', 'reports/paired_response96_curves.npz') != '' }}
        run: python -B -m tools96.publish96 --check
