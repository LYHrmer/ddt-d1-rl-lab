name: D1 policy gradient direction

on:
  push:
    paths: ['tools95/**', 'tests/test_policy_direction95*.py', 'tests/test_model_direction95.py', 'tests/test_observation_contract95.py', 'docs/experiments95/**', 'docs/supermimic_policy_direction95*', 'docs/assets/policy_direction95*', 'reports/cold_start95_wheel_direction.json', 'reports/policy_direction95*', '.github/workflows/policy-direction95.yml']
  pull_request:
    paths: ['tools95/**', 'tests/test_policy_direction95*.py', 'tests/test_model_direction95.py', 'tests/test_observation_contract95.py', 'docs/experiments95/**', 'docs/supermimic_policy_direction95*', 'docs/assets/policy_direction95*', 'reports/cold_start95_wheel_direction.json', 'reports/policy_direction95*', '.github/workflows/policy-direction95.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install archive test dependencies
        run: python -m pip install --quiet 'numpy==2.2.6' 'pytest==8.4.2'
      - name: Verify direction gates, measured video and nine matched starting conditions
        run: python -B -m pytest -p no:cacheprovider -q tests/test_policy_direction95.py tests/test_policy_direction95_video.py
      - name: Recompute wheel-direction report from the frozen curves
        run: python -B -m tools95.recheck_curves95 --check
      - name: Recompute published policy-direction scores
        if: ${{ hashFiles('reports/policy_direction95.json', 'reports/policy_direction95_curves.npz') != '' }}
        run: python -B -m tools95.publish95 --check
      - name: Replay the public observation and privileged-input checks
        run: python -B -m tools95.check_privileged_observation95 --check-example
      - name: Detect corrupted history and prematurely delivered measurements
        run: python -B -m pytest -p no:cacheprovider -q tests/test_observation_contract95.py
      - name: Exercise the analytic gradients and shadow optimizer with CPU PyTorch
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -c 'import torch'
          python -B -m pytest -p no:cacheprovider -q tests/test_model_direction95.py
