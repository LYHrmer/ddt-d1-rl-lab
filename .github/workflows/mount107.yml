name: D1 sensor mount
on:
  push:
    paths: ['tools107/**', 'tests/test_*107.py', 'docs/experiments107/**', 'reports/mount107/**', 'tools106/sightline106.py', 'tools105/surface105.py', 'tools100/sensor100.py', '.github/workflows/mount107.yml']
  pull_request:
    paths: ['tools107/**', 'tests/test_*107.py', 'docs/experiments107/**', 'reports/mount107/**', 'tools106/sightline106.py', 'tools105/surface105.py', 'tools100/sensor100.py', '.github/workflows/mount107.yml']
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --quiet numpy==2.2.6 pytest==8.4.2
      - name: Verify the mount contract, coordinates, budget and failure paths
        run: |
          sha256sum --check --status docs/experiments107/sources.sha256
          python -B -m pytest -p no:cacheprovider -q tests/test_*107.py
      - name: Read back clearances, sightlines and all acquired first returns
        run: |
          if [[ -d reports/mount107 ]] || git cat-file -e 'HEAD^:reports/mount107/installation/seal.json' 2>/dev/null; then
            python -B -m tools107.run107 check
          fi
