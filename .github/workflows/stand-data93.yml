name: D1 crossed standing data

on:
  push:
    paths: ['tools93/**', 'tests/*93.py', 'docs/experiments93/**', 'docs/stand_data93.md', 'docs/assets/stand_data93.mp4', 'reports/stand_data93*', '.github/workflows/stand-data93.yml']
  pull_request:
    paths: ['tools93/**', 'tests/*93.py', 'docs/experiments93/**', 'docs/stand_data93.md', 'docs/assets/stand_data93.mp4', 'reports/stand_data93*', '.github/workflows/stand-data93.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      PYTHONPATH: training
      MUJOCO_GL: disable
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -m pip install --quiet 'numpy==2.2.6' 'gymnasium==1.2.0' 'mujoco==3.3.0' 'pytest==8.4.2'
      - name: Recompute the crossed scores, training coverage and video identities
        run: python -m pytest -p no:cacheprovider -q tests/test*93.py
