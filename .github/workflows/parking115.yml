name: D1 parking wheel contrast
on:
  push:
    paths: &study_paths
      - 'tools115/**'
      - 'tests/test_*115.py'
      - 'docs/experiments115/**'
      - 'docs/parking_rf115*.md'
      - 'reports/parking115/**'
      - 'docs/experiments114/closed_loop.json'
      - 'reports/parking114/**'
      - 'reports/speed_world113/**'
      - 'tools114/**'
      - 'tools113/**'
      - 'tools112/**'
      - 'tools111/**'
      - 'tools110/**'
      - 'tools109/run109.py'
      - 'tools94/common94.py'
      - 'tools92/launch92.py'
      - 'tools91/launch91.py'
      - 'tools27/resource_guard27.py'
      - 'training/configs/pilot03d.json'
      - 'training/d1_rl/interface.py'
      - '.github/workflows/parking115.yml'
  pull_request:
    paths: *study_paths
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --quiet numpy==2.2.6
      - run: python -B -m unittest discover -s tests -p 'test_*115.py'
      - name: Reconstruct frozen policy inputs and re-score paired trajectories
        run: python -B -m tools115.archive
