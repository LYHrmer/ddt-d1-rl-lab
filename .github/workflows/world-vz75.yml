name: world-vz75
on:
  push:
    branches: [main]
    paths: ['tools75/**', 'tests/test_fit75.py', 'tests/test_compare75.py', 'tests/test_run75.py', 'tests/test_outputs75.py', 'tests/test_labels75.py', 'docs/experiments75/**', '.github/workflows/world-vz75.yml']
  pull_request:
    paths: ['tools75/**', 'tests/test_fit75.py', 'tests/test_compare75.py', 'tests/test_run75.py', 'tests/test_outputs75.py', 'tests/test_labels75.py', 'docs/experiments75/**', '.github/workflows/world-vz75.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-world-vz:
    runs-on: ubuntu-22.04
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: '.:training'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -m pip install --quiet 'numpy<3' pytest
      - name: Verify one-variable objective, complete pairing and all regression gates
        run: python -m pytest --noconftest tests/test_fit75.py tests/test_run75.py tests/test_compare75.py tests/test_outputs75.py tests/test_labels75.py -q
