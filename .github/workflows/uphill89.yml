name: D1 uphill curriculum PPO

on:
  push:
    paths:
      - 'tools89/**'
      - 'tests/*89.py'
      - 'docs/experiments89/**'
      - 'reports/uphill_curriculum89*'
      - '.github/workflows/uphill89.yml'
  pull_request:
    paths:
      - 'tools89/**'
      - 'tests/*89.py'
      - 'docs/experiments89/**'
      - 'reports/uphill_curriculum89*'
      - '.github/workflows/uphill89.yml'

permissions:
  contents: read

jobs:
  curriculum-and-measurements:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      MUJOCO_GL: disable
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
      - run: python -m pip install 'stable-baselines3==2.7.0' 'gymnasium==1.2.0' 'mujoco==3.3.0' 'numpy<3' pytest
      - name: Check reset geometry, inherited Adam state, coverage, holdout and clip sources
        run: python -m pytest --noconftest -q tests/test*89.py
