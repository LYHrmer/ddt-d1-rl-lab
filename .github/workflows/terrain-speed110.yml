name: D1 terrain speed qualification
on:
  push:
    paths: &terrain_paths
      - 'tools110/**'
      - 'tools109/readback109.py'
      - 'tests/test_terrain_speed110.py'
      - 'reports/speed110/**'
      - 'docs/speed110_proposal.md'
      - 'docs/assets/speed110.mp4'
      - 'training/d1_rl/**'
      - 'training/configs/pilot03d.json'
      - '.github/workflows/terrain-speed110.yml'
  pull_request:
    paths: *terrain_paths
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --quiet numpy==2.2.6
      - run: python -B -m unittest discover -s tests -p test_terrain_speed110.py
      - run: python -B -m tools110.readback
