name: D1 wheel-track occlusion

on:
  push:
    paths: ['tools102/**', 'tests/test_*102.py', 'docs/experiments102/**', 'docs/occlusion_position102*', 'docs/assets/occlusion102.mp4', 'reports/occlusion102/**', '.github/workflows/occlusion102.yml']
  pull_request:
    paths: ['tools102/**', 'tests/test_*102.py', 'docs/experiments102/**', 'docs/occlusion_position102*', 'docs/assets/occlusion102.mp4', 'reports/occlusion102/**', '.github/workflows/occlusion102.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU readback dependencies
        run: |
          python -m pip install --quiet 'numpy==2.2.6' 'pytest==8.4.2' 'pillow==11.3.0'
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
      - name: Verify equal occluders, causal history and slow playback clocks
        run: python -B -m pytest -p no:cacheprovider -q tests/test_*102.py
      - name: Reconstruct the archived geometry and all six frozen students
        run: python -B -m tools102.publish102 --check --replay-models
