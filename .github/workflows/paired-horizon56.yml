name: paired-horizon56
on:
  push:
    branches: [main]
    paths: ['tools56/**', 'tools57/**', 'tests/test_*56.py', 'tests/test_response57.py', 'docs/experiments56/**', 'docs/experiments57/**', '.github/workflows/paired-horizon56.yml']
  pull_request:
    paths: ['tools56/**', 'tools57/**', 'tests/test_*56.py', 'tests/test_response57.py', 'docs/experiments56/**', 'docs/experiments57/**', '.github/workflows/paired-horizon56.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-cpu:
    runs-on: ubuntu-22.04
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: '.:training'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -m pip install --quiet 'numpy<3' pytest
      - name: Verify paired fits, observed gradients and action-response diagnostics
        run: python -m pytest --noconftest tests/test_fit56.py tests/test_run56.py tests/test_numerics54.py tests/test_observed55.py tests/test_response57.py -q
