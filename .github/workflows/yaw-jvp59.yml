name: yaw-jvp59
on:
  push:
    branches: [main]
    paths: ['tools59/**', 'tests/test_*59.py', 'docs/experiments59/**', '.github/workflows/yaw-jvp59.yml']
  pull_request:
    paths: ['tools59/**', 'tests/test_*59.py', 'docs/experiments59/**', '.github/workflows/yaw-jvp59.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-cpu:
    runs-on: ubuntu-22.04
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: '.:training'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -m pip install --quiet 'numpy<3' pytest
      - name: Verify derivative supervision, exact pairing and independent physical gates
        run: python -m pytest --noconftest tests/test_fit59.py tests/test_run59.py -q
