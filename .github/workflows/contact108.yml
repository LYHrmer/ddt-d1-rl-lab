name: D1 measured step response
on:
  push:
    paths:
      - 'tools108/**'
      - 'tools77/geometry77.py'
      - 'tools100/sensor100.py'
      - 'docs/experiments100/pointcloud_density.json'
      - 'tests/test_*108.py'
      - 'docs/experiments108/**'
      - 'reports/contact108/**'
      - 'docs/assets/contact108.mp4'
      - 'tools87/terrain87.py'
      - 'tools89/course89.py'
      - 'tools89/train89.py'
      - 'training/d1_rl/env.py'
      - 'training/d1_rl/interface.py'
      - 'training/d1_rl/delay_env18.py'
      - 'training/configs/pilot03d.json'
      - '.github/workflows/contact108.yml'
  pull_request:
    paths:
      - 'tools108/**'
      - 'tools77/geometry77.py'
      - 'tools100/sensor100.py'
      - 'docs/experiments100/pointcloud_density.json'
      - 'tests/test_*108.py'
      - 'docs/experiments108/**'
      - 'reports/contact108/**'
      - 'docs/assets/contact108.mp4'
      - 'tools87/terrain87.py'
      - 'tools89/course89.py'
      - 'tools89/train89.py'
      - 'training/d1_rl/env.py'
      - 'training/d1_rl/interface.py'
      - 'training/d1_rl/delay_env18.py'
      - 'training/configs/pilot03d.json'
      - '.github/workflows/contact108.yml'
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --quiet numpy==2.2.6 pytest==8.4.2
      - name: Test contact clocks, action offsets and score thresholds
        run: python -B -m pytest -p no:cacheprovider -q tests/test_contact108.py tests/test_model108.py tests/test_readback108.py tests/test_video108.py
      - name: Recalculate the recorded contact response, held-out errors and policy decision
        run: python -B -m tools108.readback108
      - name: Check the published film against the native replay receipt
        run: |
          python -B - <<'PY'
          from pathlib import Path
          from tools94.common94 import digest, read
          public = Path("reports/contact108")
          proof = read(public/"provenance.json")
          video = read(public/"video.json")
          movie = Path("docs/assets/contact108.mp4")
          assert video["status"] == "COMPLETE" and video["split"] == "blind" and video["all_episodes_complete"]
          assert proof["stage_seals"]["video"]["files"]["video.json"] == digest(public/"video.json")
          assert digest(movie) == video["sha256"] == proof["stage_seals"]["video"]["files"]["step108.mp4"]
          PY
